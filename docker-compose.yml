version: '3.8'

services:
  redis:
    image: redis:6.2-alpine
    container_name: codeforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  judge0-db:
    image: postgres:13.0
    container_name: judge0_db
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    restart: always

  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0_server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - redis
    restart: always

  judge0-worker:
    image: judge0/judge0:1.13.0
    container_name: judge0_worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - redis
    restart: always

volumes:
  redis_data:
  judge0_db_data:
